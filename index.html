<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة خاصة ☕✨</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0c20;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-gold: #e2b714;
            --accent-pink: #ff758c;
            --text-color: #f1f1f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #090514 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .names-header {
            margin-bottom: 25px;
        }

        .styled-name {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            color: var(--accent-pink);
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.4);
        }

        .heart {
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin: 0 10px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: #fff;
        }

        p.desc {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .details-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            border-right: 4px solid var(--accent-gold);
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-item span {
            margin-left: 10px;
            font-size: 1.2rem;
        }

        .time-picker-group {
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--accent-gold);
        }

        input[type="time"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .btn-accept {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3);
            margin-top: 20px;
        }

        .btn-accept:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 117, 140, 0.5);
        }

        .location-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .location-link:hover {
            text-decoration: underline;
        }

        .code-tag {
            font-family: monospace;
            font-size: 0.75rem;
            color: #666;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="names-header">
            <span class="styled-name">𝓐𝓱𝓶𝓮𝓭</span>
            <span class="heart">☕</span>
            <span class="styled-name">𝓣𝓪𝓻𝓽𝓮𝓮𝓵</span>
        </div>

        <h1>دعوة خاصة لقهوة ودردشة ✨</h1>
        <p class="desc">
            بما إن البرمجة تصنع الحلول، أحببت أن أصمم هذه الدعوة خصيصاً لكِ! يسرّني جداً أن نلتقي لنستمتع بوقت لطيف وحديث جميل.
        </p>

        <div class="details-box">
            <div class="detail-item">
                <span>📍</span>
                <div><strong>المكان:</strong> Tostado Coffee Lab</div>
            </div>
            <div class="detail-item">
                <span>📅</span>
                <div><strong>اليوم:</strong> الاثنين - 05 / 10 / 2026</div>
            </div>
            
            <div class="time-picker-group">
                <label for="meetTime">⏰ اختاري الوقت المناسب لكِ:</label>
                <input type="time" id="meetTime" value="17:00">
            </div>
        </div>

        <button class="btn-accept" onclick="acceptInvitation()">قبول الدعوة ☕✨</button>

        <br>
        <a href="https://maps.app.goo.gl/eHMZbjUvsFSoE5sm7" target="_blank" class="location-link">
            📍 عرض موقع الكافيه على الخرائط
        </a>

        <div class="code-tag">
            &lt;code_by_ahmed /&gt;
        </div>
    </div>

    <script>
        function acceptInvitation() {
            const timeInput = document.getElementById('meetTime').value;
            
            if(!timeInput) {
                alert('الرجاء اختيار الوقت المناسب أولاً! 😊');
                return;
            }

            // تحويل الوقت إلى صيغة AM/PM
            const [hours, minutes] = timeInput.split(':');
            const hourNum = parseInt(hours, 10);
            const ampm = hourNum >= 12 ? 'مساءً' : 'صباحاً';
            const formattedHour = hourNum % 12 || 12;
            const timeString = `${formattedHour}:${minutes} ${ampm}`;

            // رقم الهاتف مجهز ومربوط بالواتساب
            const myPhoneNumber = "249922005334"; 
            const message = `أهلاً Ahmed! ☕✨\nقبلت الدعوة، والموعد يظبط معي يوم الاثنين 05/10 الساعة ${timeString}. أراك هناك!`;
            
            const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
            
            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
